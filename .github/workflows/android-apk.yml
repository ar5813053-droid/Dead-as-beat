name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3.0-linux-templates

      - name: Download Godot 4.3 stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -o godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          # Export templates
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -o templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/ || true
          # tpz extracts differently sometimes
          if [ -d /tmp/godot_templates/templates ]; then
            cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          fi
          ls -la ~/.local/share/godot/export_templates/4.3.stable/ || ls -la /tmp/godot_templates/

      - name: Prepare export
        run: |
          mkdir -p builds
          # Ensure editor settings know templates path
          mkdir -p ~/.config/godot
          echo 'export/android/android_sdk_path = "'$ANDROID_HOME'"' > ~/.config/godot/editor_settings-4.3.tres || true

      - name: Export debug APK
        run: |
          GODOT=~/godot/Godot_v4.3-stable_linux.x86_64
          $GODOT --headless --path . --export-debug "Android" builds/NeonBeat-debug.apk 2>&1 | tee export.log
          if [ ! -f builds/NeonBeat-debug.apk ]; then
            echo "APK was not produced. Common causes:"
            echo "  - Missing or mismatched export templates"
            echo "  - Android SDK / build-tools not found by Godot"
            echo "  - export_presets.cfg package name / signing settings"
            echo "---- export.log ----"
            cat export.log
            exit 1
          fi
          ls -lh builds/NeonBeat-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonBeat-debug-apk
          path: builds/NeonBeat-debug.apk
          if-no-files-found: error
          retention-days: 14
