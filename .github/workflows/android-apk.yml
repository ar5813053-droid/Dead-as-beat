name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          mkdir -p "$SDK"
          yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Download Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" /tmp/godot-templates
          cd "$HOME/godot"
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -oq godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          curl -fL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -oq templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          # Godot 4.3 reads editor_settings-4.3.tres; also write legacy name
          SETTINGS_BODY=$(cat <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$SDK"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
)
          printf '%s\n' "$SETTINGS_BODY" > "$HOME/.config/godot/editor_settings-4.tres"
          printf '%s\n' "$SETTINGS_BODY" > "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "=== editor_settings-4.3.tres ==="
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "=== SDK check ==="
          ls -la "$SDK/platform-tools" "$SDK/build-tools" 2>&1 | head -20
          test -d "$SDK/platform-tools"
          test -d "$SDK/build-tools"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          set +e
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --verbose --path . \
            --export-debug "Android" builds/NeonBeat-debug.apk 2>&1 | tee /tmp/godot-export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ ! -s builds/NeonBeat-debug.apk ]; then
            echo "::error::APK export failed (exit=$STATUS). Last 80 log lines:"
            tail -n 80 /tmp/godot-export.log || true
            exit 1
          fi
          ls -lh builds/NeonBeat-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonBeat-debug-apk
          path: builds/NeonBeat-debug.apk
          if-no-files-found: error
          retention-days: 14
