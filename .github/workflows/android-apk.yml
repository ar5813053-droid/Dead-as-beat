name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            ln -sfn /root/.local/share/godot/export_templates/4.3.stable \
              ~/.local/share/godot/export_templates/4.3.stable
          else
            ls -la /root/.local/share/godot/export_templates/ || true
            SRC=$(find /root/.local/share/godot/export_templates -maxdepth 1 -type d -name '4.3*' 2>/dev/null | head -1 || true)
            if [ -n "${SRC:-}" ]; then
              ln -sfn "$SRC" ~/.local/share/godot/export_templates/4.3.stable
            fi
          fi
          ls -la ~/.local/share/godot/export_templates/ || true
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          JAVA="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JAVA\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
          echo "SDK=$SDK JAVA=$JAVA"
          ls -la "$SDK/platform-tools" 2>/dev/null | head -5 || true

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          grep -q 'import_etc2_astc=true' project.godot
          echo "--- project.godot rendering ---"
          grep -A8 '\[rendering\]' project.godot || true
          GODOT_BIN=$(command -v godot || command -v Godot || true)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /usr /opt /root -name 'Godot*' -type f 2>/dev/null | head -1 || true)
          fi
          echo "Using Godot: $GODOT_BIN"
          "$GODOT_BIN" --version || true
          "$GODOT_BIN" --headless --path . --import || true
          "$GODOT_BIN" --headless --path . --script tools/print_etc2.gd || true
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          JAVA="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JAVA\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
          set +e
          "$GODOT_BIN" --headless --verbose --path . \
            --export-debug "Android" builds/NeonBeat-debug.apk 2>&1 | tee /tmp/godot-export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ ! -s builds/NeonBeat-debug.apk ]; then
            echo "::error::APK export failed (exit=$STATUS). Log:"
            tail -n 120 /tmp/godot-export.log || true
            exit 1
          fi
          ls -lh builds/NeonBeat-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonBeat-Android-APK
          path: builds/NeonBeat-debug.apk
          if-no-files-found: error
          retention-days: 14
