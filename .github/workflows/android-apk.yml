name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$HOME/.android/sdk}"
          mkdir -p "$SDK"
          yes | sdkmanager --sdk_root="$SDK" --licenses
          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_PATH"

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -fL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -oq godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/godot"
          curl -fL -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -oq templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          config_version=5
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path . --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" \
            --headless --path . \
            --export-debug "Android" builds/NeonBeat-debug.apk
          test -s builds/NeonBeat-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonBeat-debug-apk
          path: builds/NeonBeat-debug.apk
          if-no-files-found: error
          retention-days: 14
